[pytest]
# Chỉ thu thập trong hai thư mục test THẬT. Gốc repo còn vài script tay tên
# `test_*.py` (test_clip_alignment.py, test_vector.py, test_trake*.py) — chúng
# chạy model/Milvus ngay lúc import và có cái gọi `exit(1)`, khiến `pytest` từ
# gốc chết ở khâu thu thập và KHÔNG chạy một test nào. Lỗi đó im lặng ở chỗ tệ
# nhất: exit code vẫn 0 nên nhìn tưởng suite đã xanh.
testpaths = tests dev_set/tests
norecursedirs = _local_backup_* data/derived data/cache
